<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识导入测试</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #e5e5e5;
    }
    h1 { color: #60a5fa; }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin: 8px 0;
    }
    .btn:hover { background: #2563eb; }
    #log {
      background: #262626;
      border: 1px solid #404040;
      border-radius: 6px;
      padding: 16px;
      margin-top: 20px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 500px;
      overflow-y: auto;
    }
    .log-line { margin: 4px 0; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .info { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>🚀 MySQL 锁机制知识导入工具</h1>

  <p>点击下面的按钮导入知识：</p>

  <button class="btn" onclick="testImport()">开始导入</button>
  <button class="btn" onclick="clearLog()">清空日志</button>

  <div id="log"></div>

  <script>
    function log(msg, type = 'info') {
      const logDiv = document.getElementById('log');
      const line = document.createElement('div');
      line.className = `log-line ${type}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.appendChild(line);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    async function testImport() {
      log('🚀 开始导入测试...', 'info');

      try {
        // 检查 JSON 文件是否存在
        log('📥 加载 import-lock-knowledge.json...', 'info');
        const response = await fetch('/import-lock-knowledge.json');

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        log(`✅ JSON 加载成功`, 'success');
        log(`   - 节点数: ${data.nodes.length}`, 'info');
        log(`   - 关系数: ${data.edges.length}`, 'info');
        log(`   - 问题数: ${data.questions.length}`, 'info');

        // 验证数据结构
        log('🔍 验证数据结构...', 'info');

        if (!Array.isArray(data.nodes)) {
          throw new Error('nodes 不是数组');
        }

        if (!Array.isArray(data.edges)) {
          throw new Error('edges 不是数组');
        }

        if (!Array.isArray(data.questions)) {
          throw new Error('questions 不是数组');
        }

        // 检查节点结构
        for (let i = 0; i < Math.min(3, data.nodes.length); i++) {
          const node = data.nodes[i];
          log(`   节点 ${i + 1}: ${node.label} (${node.id})`, 'info');
        }

        log('✅ 数据结构验证通过', 'success');
        log('', 'info');
        log('📝 现在请打开应用主页面，在控制台执行:', 'info');
        log('   await window.importLockKnowledge()', 'info');

      } catch (error) {
        log(`❌ 导入失败: ${error.message}`, 'error');
        console.error(error);
      }
    }
  </script>
</body>
</html>
